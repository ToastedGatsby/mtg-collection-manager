# Local PostgreSQL for development: `docker compose up -d`
services:
  postgres:
    image: postgres:17
    container_name: mtg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtg
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg_dev_password # dev only; production credentials live in env vars
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mtg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mtg-pgdata:
